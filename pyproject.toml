[project]
name = "ai-stock-research-assistant"
version = "0.1.0"
description = "AI-powered stock research assistant: collects price, fundamental, macro and news data and generates analyst memos with the Anthropic API."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "OhneisB" }]
keywords = ["stocks", "research", "llm", "anthropic", "yfinance", "fred"]
dependencies = [
    "anthropic>=0.40",
    "yfinance>=0.2.50",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
docs = ["reportlab>=4.0"]
web = ["flask>=3.0"]
dev = ["pytest>=8.0", "reportlab>=4.0", "flask>=3.0"]

[project.scripts]
research = "stock_research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
